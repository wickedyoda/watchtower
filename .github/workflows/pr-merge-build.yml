name: Build and publish Docker image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            platform_id: amd64
            goarch: amd64
          - platform: linux/arm64
            platform_id: arm64
            goarch: arm64
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Set image name
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Build watchtower binary
        run: |
          GOOS=linux GOARCH=${{ matrix.goarch }} CGO_ENABLED=0 \
          go build -ldflags "-X github.com/containrrr/watchtower/internal/meta.Version=${GITHUB_SHA}" \
          -o dockerfiles/watchtower .

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v5
        with:
          context: ./dockerfiles
          file: ./dockerfiles/Dockerfile.binary
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests/${{ matrix.platform_id }}
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${{ matrix.platform_id }}/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.platform_id }}
          path: /tmp/digests/${{ matrix.platform_id }}/*
          if-no-files-found: error
          retention-days: 1

  merge:
    runs-on: ubuntu-latest
    needs:
      - build
    steps:
      - name: Download amd64 digest
        uses: actions/download-artifact@v4
        with:
          name: digests-amd64
          path: /tmp/digests/amd64

      - name: Download arm64 digest
        uses: actions/download-artifact@v4
        with:
          name: digests-arm64
          path: /tmp/digests/arm64

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Set image name
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Create and push tags
        run: |
          set -euo pipefail
          amd64_digest="$(find /tmp/digests/amd64 -maxdepth 1 -type f -printf '%f\n' | head -n1)"
          arm64_digest="$(find /tmp/digests/arm64 -maxdepth 1 -type f -printf '%f\n' | head -n1)"
          [ -n "${amd64_digest}" ]
          [ -n "${arm64_digest}" ]

          docker buildx imagetools create \
            --tag "${IMAGE_NAME}:amd64" \
            "${IMAGE_NAME}@sha256:${amd64_digest}"

          docker buildx imagetools create \
            --tag "${IMAGE_NAME}:arm64" \
            "${IMAGE_NAME}@sha256:${arm64_digest}"

          docker buildx imagetools create \
            --tag "${IMAGE_NAME}:latest" \
            --tag "${IMAGE_NAME}:${GITHUB_SHA}" \
            "${IMAGE_NAME}@sha256:${amd64_digest}" \
            "${IMAGE_NAME}@sha256:${arm64_digest}"
