name: Verify and Security Checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify formatting
        run: |
          set -euo pipefail
          mapfile -d '' files < <(find . -type f -name '*.go' -not -path './vendor/*' -not -path './.git/*' -print0)
          if [ "${#files[@]}" -eq 0 ]; then
            exit 0
          fi
          unformatted="$(gofmt -l "${files[@]}")"
          if [ -n "${unformatted}" ]; then
            echo "Unformatted files:"
            echo "${unformatted}"
            exit 1
          fi

      - name: Download dependencies
        run: go mod download

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.6.1
          "$(go env GOPATH)/bin/staticcheck" ./...

      - name: Vulnerability scan
        run: |
          set -euo pipefail
          go install golang.org/x/vuln/cmd/govulncheck@latest

          # Temporarily allow known, currently unpatched Moby advisories and
          # fail on any newly detected vulnerabilities.
          set +e
          GOVULN_OUT="$("$(go env GOPATH)/bin/govulncheck" ./... 2>&1)"
          GOVULN_STATUS=$?
          set -e

          echo "${GOVULN_OUT}"

          if [ "${GOVULN_STATUS}" -eq 0 ]; then
            exit 0
          fi

          KNOWN_ALLOWED_REGEX='GO-2026-4887|GO-2026-4883|GO-2026-5668'
          UNKNOWN_IDS="$(echo "${GOVULN_OUT}" | grep -oE 'GO-[0-9]{4}-[0-9]+' | sort -u | grep -Ev "^(${KNOWN_ALLOWED_REGEX})$" || true)"

          if [ -z "${UNKNOWN_IDS}" ]; then
            echo "Only known unpatched vulnerabilities found; continuing."
            exit 0
          fi

          echo "Unexpected vulnerability IDs detected:"
          echo "${UNKNOWN_IDS}"
          exit "${GOVULN_STATUS}"
